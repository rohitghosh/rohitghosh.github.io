<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="80" y="52" font-size="13" fill="#000000">$ (a cost, or what a buyer gains)</text>
