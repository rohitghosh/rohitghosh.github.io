  <circle cx="100" cy="215" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <circle cx="100" cy="228" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <circle cx="100" cy="252" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <circle cx="520" cy="120" r="4.5" fill="#000000"/>
  <circle cx="520" cy="138" r="4.5" fill="#000000"/>
  <circle cx="520" cy="156" r="4.5" fill="#000000"/>
  <circle cx="520" cy="200" r="4.5" fill="#000000"/>
  <circle cx="520" cy="215" r="4.5" fill="#000000"/>
  <circle cx="520" cy="228" r="4.5" fill="#000000"/>
  <circle cx="520" cy="252" r="4.5" fill="#000000"/>
  <text x="100" y="308" text-anchor="middle" font-size="12" fill="#000000">then</text>
  <text x="520" y="308" text-anchor="middle" font-size="12" fill="#000000">now</text>
  <text x="100" y="326" text-anchor="middle" font-size="12" fill="#000000">3 of 7 buy</text>
  <text x="520" y="326" text-anchor="middle" font-size="12" fill="#000000">7 of 7 buy</text>
  <text x="40" y="356" font-size="12" fill="#000000">Gray band: the lowest line, the one buyers actually bear.</text>
  <text x="40" y="374" font-size="12" fill="#000000">Dots: what each buyer gains. Filled dots sit above the lowest line, so they buy.</text>
