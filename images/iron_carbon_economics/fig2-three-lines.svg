  <polyline points="80,110 225,110 297,230 540,240" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <polyline points="80,170 540,188" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="548" y="192" font-size="12" fill="#000000">T: ask someone</text>
  <text x="548" y="244" font-size="12" fill="#000000">C: check yourself</text>
  <text x="548" y="272" font-size="12" fill="#000000">V: go blind</text>
  <circle cx="100" cy="120" r="4.5" fill="#000000"/>
  <circle cx="100" cy="138" r="4.5" fill="#000000"/>
  <circle cx="100" cy="156" r="4.5" fill="#000000"/>
