<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 512" width="680" height="512" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="680" height="512" fill="#ffffff"/>

  <text x="40" y="50" font-size="14" font-weight="bold" fill="#000000">1. Cheaper than going blind</text>
  <line x1="40" y1="64" x2="40" y2="184" stroke="#000000" stroke-width="1"/>
  <line x1="40" y1="184" x2="325" y2="184" stroke="#000000" stroke-width="1"/>
  <polyline points="40,134 186,134 192,164 325,164" fill="none" stroke="#cccccc" stroke-width="10" stroke-linejoin="round"/>
  <line x1="40" y1="79" x2="325" y2="79" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="40" y1="134" x2="325" y2="134" stroke="#000000" stroke-width="2" stroke-dasharray="2 4"/>
  <polyline points="40,99 180,99 192,164 325,164" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="180" y1="64" x2="180" y2="184" stroke="#999999" stroke-width="1"/>
  <text x="180" y="198" text-anchor="middle" font-size="12" fill="#000000">AI arrives</text>
  <text x="40" y="216" font-size="12" fill="#000000">Was: go blind. Now: ask the AI.</text>
  <text x="40" y="232" font-size="12" fill="#000000">Advice where there was none: biggest gain.</text>

  <text x="355" y="50" font-size="14" font-weight="bold" fill="#000000">2. Cheaper than checking yourself</text>
  <line x1="355" y1="64" x2="355" y2="184" stroke="#000000" stroke-width="1"/>
  <line x1="355" y1="184" x2="640" y2="184" stroke="#000000" stroke-width="1"/>
  <polyline points="355,134 501,134 507,164 640,164" fill="none" stroke="#cccccc" stroke-width="10" stroke-linejoin="round"/>
  <line x1="355" y1="79" x2="640" y2="79" stroke="#000000" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="355" y1="134" x2="640" y2="134" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <polyline points="355,99 495,99 507,164 640,164" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="495" y1="64" x2="495" y2="184" stroke="#999999" stroke-width="1"/>
  <text x="495" y="198" text-anchor="middle" font-size="12" fill="#000000">AI arrives</text>
  <text x="355" y="216" font-size="12" fill="#000000">Was: check yourself. Now: ask the AI.</text>
  <text x="355" y="232" font-size="12" fill="#000000">Saves time, but who pays the AI matters.</text>

  <text x="40" y="260" font-size="14" font-weight="bold" fill="#000000">3. Asking was already cheapest</text>
  <line x1="40" y1="274" x2="40" y2="394" stroke="#000000" stroke-width="1"/>
  <line x1="40" y1="394" x2="325" y2="394" stroke="#000000" stroke-width="1"/>
  <polyline points="40,349 180,349 192,379 325,379" fill="none" stroke="#cccccc" stroke-width="10" stroke-linejoin="round"/>
  <line x1="40" y1="289" x2="325" y2="289" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="40" y1="314" x2="325" y2="314" stroke="#000000" stroke-width="2" stroke-dasharray="2 4"/>
  <polyline points="40,349 180,349 192,379 325,379" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="180" y1="274" x2="180" y2="394" stroke="#999999" stroke-width="1"/>
  <text x="180" y="408" text-anchor="middle" font-size="12" fill="#000000">AI arrives</text>
  <text x="40" y="426" font-size="12" fill="#000000">Was: pay a doctor. Now: cheaper advice.</text>
  <text x="40" y="442" font-size="12" fill="#000000">Mostly moves money from advisors to buyers.</text>

  <text x="355" y="260" font-size="14" font-weight="bold" fill="#000000">4. Still above the lowest line</text>
  <line x1="355" y1="274" x2="355" y2="394" stroke="#000000" stroke-width="1"/>
  <line x1="355" y1="394" x2="640" y2="394" stroke="#000000" stroke-width="1"/>
  <line x1="355" y1="374" x2="640" y2="374" stroke="#cccccc" stroke-width="10"/>
  <polyline points="355,289 495,289 507,324 640,324" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="355" y1="344" x2="640" y2="344" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="355" y1="374" x2="640" y2="374" stroke="#000000" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="495" y1="274" x2="495" y2="394" stroke="#999999" stroke-width="1"/>
  <text x="495" y="408" text-anchor="middle" font-size="12" fill="#000000">AI arrives</text>
  <text x="355" y="426" font-size="12" fill="#000000">Cheaper advice, but still above the lowest</text>
  <text x="355" y="442" font-size="12" fill="#000000">line: nothing changes.</text>

  <text x="40" y="474" font-size="12" fill="#000000">Solid: ask someone (T). Dashed: check yourself (C). Dotted: go blind (V).</text>
  <text x="40" y="492" font-size="12" fill="#000000">Gray band: the lowest line, which sets volume. Higher = costlier.</text>
</svg>
