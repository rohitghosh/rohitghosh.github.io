<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>
  <rect x="250" y="20" width="180" height="46" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
  <text x="340" y="39" text-anchor="middle" font-size="12" fill="#000000">A new costly need appears</text>
  <text x="340" y="55" text-anchor="middle" font-size="12" fill="#000000">a new drug, say Ozempic</text>
  <line x1="340" y1="66" x2="340" y2="96" stroke="#000000" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="250" y="100" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="340.0" y="122.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Premiums go up</text>
  <text x="340.0" y="140.0" text-anchor="middle" font-size="12" fill="#000000">for everyone in the pool</text>
  <rect x="470" y="210" width="170" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="555.0" y="235.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">The healthiest leave</text>
  <text x="555.0" y="253.0" text-anchor="middle" font-size="12" fill="#000000">'I pay more for the same'</text>
  <rect x="250" y="330" width="180" height="56" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="340.0" y="355.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">The pool left is sicker</text>
  <text x="340.0" y="373.0" text-anchor="middle" font-size="12" fill="#000000">fewer light users to fund it</text>
  <rect x="40" y="210" width="170" height="56" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="125.0" y="235.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Cost per member rises</text>
  <text x="125.0" y="253.0" text-anchor="middle" font-size="12" fill="#000000">so premiums rise again</text>
  <polyline points="430,125 555,125 555,206" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
  <polyline points="555,266 555,358 434,358" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
  <polyline points="250,358 125,358 125,270" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
  <polyline points="125,210 125,125 246,125" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text x="340" y="245" text-anchor="middle" font-size="12" fill="#444444">Each turn of the loop</text>
  <text x="340" y="262" text-anchor="middle" font-size="12" fill="#444444">leaves a smaller, sicker pool</text>
</svg>
