<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="330" fill="#ffffff"/>
  <text x="40" y="46" font-size="14" font-weight="bold" fill="#000000">Netflix: one more viewer</text>
  <rect x="40" y="58" width="470" height="50" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
  <text x="275" y="88" text-anchor="middle" font-size="12" fill="#000000">Content and servers: already paid for</text>
  <rect x="510" y="58" width="10" height="50" fill="#000000" stroke="#000000" stroke-width="1"/>
  <text x="530" y="78" font-size="12" fill="#000000">one more stream</text>
  <text x="530" y="95" font-size="12" fill="#000000">costs ~nothing</text>
  <text x="40" y="150" font-size="14" font-weight="bold" fill="#000000">Hospital: one more patient</text>
  <rect x="40" y="162" width="210" height="56" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
  <text x="145" y="186" text-anchor="middle" font-size="12" fill="#000000">Building and</text>
  <text x="145" y="202" text-anchor="middle" font-size="12" fill="#000000">equipment</text>
  <rect x="250" y="162" width="110" height="56" fill="#cccccc" stroke="#000000" stroke-width="1"/>
  <text x="305.0" y="186" text-anchor="middle" font-size="12" fill="#000000">Drugs and</text>
  <text x="305.0" y="202" text-anchor="middle" font-size="12" fill="#000000">consumables</text>
  <rect x="360" y="162" width="70" height="56" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="395.0" y="194" text-anchor="middle" font-size="12" fill="#000000">Implants</text>
  <rect x="430" y="162" width="90" height="56" fill="#cccccc" stroke="#000000" stroke-width="1"/>
  <text x="475.0" y="186" text-anchor="middle" font-size="12" fill="#000000">Doctor and</text>
  <text x="475.0" y="202" text-anchor="middle" font-size="12" fill="#000000">theatre time</text>
  <rect x="520" y="162" width="70" height="56" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="555.0" y="186" text-anchor="middle" font-size="12" fill="#000000">Nursing</text>
  <text x="555.0" y="202" text-anchor="middle" font-size="12" fill="#000000">hours</text>
  <rect x="590" y="162" width="50" height="56" fill="#cccccc" stroke="#000000" stroke-width="1"/>
  <text x="615.0" y="186" text-anchor="middle" font-size="12" fill="#000000">Lab</text>
  <text x="615.0" y="202" text-anchor="middle" font-size="12" fill="#000000">tests</text>
  <line x1="40" y1="232" x2="246" y2="232" stroke="#000000" stroke-width="1"/>
  <line x1="40" y1="226" x2="40" y2="232" stroke="#000000" stroke-width="1"/>
  <line x1="246" y1="226" x2="246" y2="232" stroke="#000000" stroke-width="1"/>
  <text x="143.0" y="250" text-anchor="middle" font-size="12" fill="#000000">fixed: the plane</text>
  <line x1="250" y1="232" x2="640" y2="232" stroke="#000000" stroke-width="1"/>
  <line x1="250" y1="226" x2="250" y2="232" stroke="#000000" stroke-width="1"/>
  <line x1="640" y1="226" x2="640" y2="232" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="250" text-anchor="middle" font-size="12" fill="#000000">moves with every case: the fuel</text>
  <text x="40" y="296" font-size="12" fill="#000000">Consumables alone run about 23% of revenue at Narayana Health's Indian hospitals.</text>
  <text x="40" y="314" font-size="12" fill="#000000">Doctors and nurses add about 28%.</text>
</svg>
